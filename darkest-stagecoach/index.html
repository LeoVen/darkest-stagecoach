<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <link rel="preconnect" href="https://fonts.gstatic.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Mate+SC&display=swap"
            rel="stylesheet"
        />
        <meta
            name="description"
            content="A place to explore class mods for the Darkest Dungeon game"
        />
        <link rel="apple-touch-icon" href="/logo.png" />
        <link rel="manifest" href="/manifest.json" />
        <title>Darkest Stagecoach</title>
        <!-- Loading screen, shown until the class data is loaded (see src/index.tsx) -->
        <style>
            body {
                margin: 0;
                background-color: #2f3129;
            }
            .loading {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.5rem;
                font-family: 'Mate SC', serif;
                color: #cccccc;
            }
            .loading img {
                width: 96px;
                height: 96px;
                animation: loading-pulse 1.6s ease-in-out infinite;
            }
            .loading-failed img {
                animation: none;
                opacity: 0.4;
            }
            .loading-failed .loading-message {
                color: #d3552e;
            }
            @keyframes loading-pulse {
                0%, 100% { opacity: 0.4; }
                50% { opacity: 1; }
            }
            @media (prefers-reduced-motion: reduce) {
                .loading img { animation: none; }
            }
        </style>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root">
            <div class="loading" role="status">
                <img src="/logo.png" alt="" />
                <div class="loading-message">Loading the stagecoach…</div>
            </div>
        </div>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
