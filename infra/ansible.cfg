# Run ansible commands from this folder so this config is picked up
[defaults]
inventory = inventory.yml
roles_path = roles
# Print task results as readable YAML instead of one-line JSON
callback_result_format = yaml
# Don't litter the server with .retry files or prompt about unknown host keys
# (the host key is already in ~/.ssh/known_hosts from your manual logins)
retry_files_enabled = False

[ssh_connection]
# Fewer SSH round trips per task
pipelining = True
