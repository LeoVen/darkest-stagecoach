# Debian's sshd_config starts with "Include /etc/ssh/sshd_config.d/*.conf" and
# sshd keeps the FIRST value it reads for each option. A drop-in named 00-*
# is therefore read before anything else (e.g. a cloud-init 50-*.conf that
# re-enables passwords) and wins.
- name: The sshd config includes the drop-in folder
  ansible.builtin.command: grep -q '^Include /etc/ssh/sshd_config.d/\*.conf' /etc/ssh/sshd_config
  changed_when: false
  check_mode: false   # read-only, safe to run in --check too

- name: SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    # Refuses to install a config that sshd can't parse, so a typo can't
    # lock you out
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

# Apply the change now, so the check below sees it
- name: Reload sshd if needed
  ansible.builtin.meta: flush_handlers

- name: Read the effective sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -T
  register: base_sshd_effective
  changed_when: false
  check_mode: false   # read-only, safe to run in --check too

- name: Password and root logins are disabled
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in base_sshd_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in base_sshd_effective.stdout_lines"
      - "'permitrootlogin no' in base_sshd_effective.stdout_lines"
    fail_msg: >-
      sshd still allows password or root logins. In --check mode this is
      expected if the hardening drop-in above would be changed.
  # In --check mode nothing was applied yet, so only report
  ignore_errors: "{{ ansible_check_mode }}"
