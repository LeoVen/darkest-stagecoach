# Order matters: allow SSH before enabling the firewall
- name: Allow incoming ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ base_ufw_allowed_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"

- name: Deny incoming, allow outgoing by default
  community.general.ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Firewall is enabled
  community.general.ufw:
    state: enabled
